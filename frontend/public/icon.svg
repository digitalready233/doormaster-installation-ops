<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="4" />

  <!-- Stylized Door Frame & Slab Graphic -->
  <g transform="translate(116, 88)" filter="url(#glow)">
    <!-- Outer Outer Frame -->
    <rect x="0" y="0" width="280" height="336" rx="28" fill="#1e293b" stroke="#38bdf8" stroke-width="8" />
    
    <!-- Door Slab (Open Angle Perspective) -->
    <path d="M 28 28 L 220 54 L 220 282 L 28 308 Z" fill="url(#accentGrad)" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" />
    
    <!-- Door Panels -->
    <path d="M 50 68 L 198 88 L 198 154 L 50 148 Z" fill="#047857" opacity="0.8" />
    <path d="M 50 178 L 198 184 L 198 250 L 50 268 Z" fill="#047857" opacity="0.8" />

    <!-- Security Smart Lock & Handle -->
    <circle cx="188" cy="170" r="14" fill="#ffffff" />
    <circle cx="188" cy="170" r="8" fill="#0f172a" />
    <rect x="184" y="174" width="8" height="24" rx="4" fill="#ffffff" />
    
    <!-- Status LED Indicator -->
    <circle cx="188" cy="150" r="4" fill="#38bdf8" />
  </g>

  <!-- App Monogram / Tech Badge -->
  <g transform="translate(256, 452)">
    <rect x="-100" y="-32" width="200" height="42" rx="21" fill="#0f172a" stroke="#10b981" stroke-width="3" />
    <text x="0" y="-5" fill="#ffffff" font-family="monospace, -apple-system, sans-serif" font-size="20" font-weight="900" text-anchor="middle" letter-spacing="4">DOORMASTER</text>
  </g>
</svg>
